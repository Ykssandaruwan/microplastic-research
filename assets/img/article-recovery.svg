<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="t d"><title id="t">From interception to recovery</title><desc id="d">Treatment options move from source control and separation to degradation and energy recovery.</desc><rect width="920" height="520" rx="38" fill="#ffffff"/><path d="M124 350 C250 258, 350 300, 470 220 S682 165, 805 95" fill="none" stroke="#223040" stroke-width="10" stroke-linecap="round" opacity=".13"/><g font-family="Inter,Arial,sans-serif" fill="#223040"><g transform="translate(70 300)"><rect width="180" height="130" rx="26" fill="#ecd8e0"/><text x="24" y="44" font-size="22" font-weight="850">Prevent</text><text x="24" y="75" font-size="14">reduce leakage</text><text x="24" y="99" font-size="14">improve waste control</text></g><g transform="translate(285 240)"><rect width="180" height="130" rx="26" fill="#ffd5b6"/><text x="24" y="44" font-size="22" font-weight="850">Separate</text><text x="24" y="75" font-size="14">filtration, settling</text><text x="24" y="99" font-size="14">flotation, wetlands</text></g><g transform="translate(500 180)"><rect width="180" height="130" rx="26" fill="#bad8e0"/><text x="24" y="44" font-size="22" font-weight="850">Degrade</text><text x="24" y="75" font-size="14">biofilms, enzymes</text><text x="24" y="99" font-size="14">oxidation, plasma</text></g><g transform="translate(715 120)"><rect width="150" height="130" rx="26" fill="#ccc8c8"/><text x="24" y="44" font-size="22" font-weight="850">Recover</text><text x="24" y="75" font-size="14">biogas</text><text x="24" y="99" font-size="14">bio-oil, syngas</text></g></g><g fill="#fff" opacity=".9"><circle cx="220" cy="110" r="18"/><circle cx="250" cy="88" r="8"/><circle cx="286" cy="120" r="13"/><circle cx="640" cy="400" r="11"/><circle cx="690" cy="382" r="18"/><circle cx="730" cy="410" r="7"/></g></svg>