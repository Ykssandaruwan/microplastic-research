<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="t d"><title id="t">Microplastic detection landscape</title><desc id="d">A visual comparison of laboratory confirmation methods and emerging field sensing methods.</desc><rect width="920" height="520" rx="38" fill="#ffffff"/><rect x="70" y="68" width="330" height="384" rx="34" fill="#ecd8e0" opacity=".86"/><rect x="520" y="68" width="330" height="384" rx="34" fill="#bad8e0" opacity=".86"/><g font-family="Inter,Arial,sans-serif" fill="#223040"><text x="235" y="123" text-anchor="middle" font-size="28" font-weight="850">Confirm in the lab</text><text x="685" y="123" text-anchor="middle" font-size="28" font-weight="850">Move toward field</text><g font-size="19" font-weight="760"><text x="112" y="190">FTIR and Raman</text><text x="112" y="238">SERS and fluorescence</text><text x="112" y="286">Pyrolysis GC-MS</text><text x="112" y="334">Microscopy and SEM-EDX</text><text x="562" y="190">Impedance sensors</text><text x="562" y="238">Particle impact signals</text><text x="562" y="286">Graphene electrodes</text><text x="562" y="334">Portable PEC tools</text></g><g fill="#fff"><circle cx="93" cy="184" r="8"/><circle cx="93" cy="232" r="8"/><circle cx="93" cy="280" r="8"/><circle cx="93" cy="328" r="8"/><circle cx="543" cy="184" r="8"/><circle cx="543" cy="232" r="8"/><circle cx="543" cy="280" r="8"/><circle cx="543" cy="328" r="8"/></g><text x="235" y="400" text-anchor="middle" font-size="16">high confidence, slower workflow</text><text x="685" y="400" text-anchor="middle" font-size="16">fast screening, still needs validation</text></g><path d="M424 260h72" stroke="#223040" stroke-width="8" stroke-linecap="round" opacity=".18"/><path d="M492 260l-28-24v48z" fill="#223040" opacity=".18"/></svg>