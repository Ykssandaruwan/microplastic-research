<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="t d"><title id="t">Major source streams of microplastics</title><desc id="d">Six main source streams moving microplastics into soil, water and air.</desc><rect width="920" height="520" rx="38" fill="#ffffff"/><circle cx="802" cy="80" r="120" fill="#bad8e0" opacity=".35"/><circle cx="132" cy="440" r="110" fill="#ffd5b6" opacity=".38"/><g transform="translate(390 196)"><circle cx="70" cy="70" r="70" fill="#223040" opacity=".92"/><circle cx="43" cy="48" r="7" fill="#ecd8e0"/><circle cx="83" cy="38" r="10" fill="#ffd5b6"/><circle cx="91" cy="84" r="6" fill="#bad8e0"/><text x="70" y="151" text-anchor="middle" font-size="20" font-weight="800" fill="#223040">Microplastics</text></g><g font-family="Inter,Arial,sans-serif" font-size="18" fill="#223040" font-weight="700"><g transform="translate(78 74)"><rect width="218" height="86" rx="22" fill="#ecd8e0"/><text x="26" y="38">Textiles</text><text x="26" y="64" font-size="14" font-weight="500">synthetic fibres</text></g><g transform="translate(623 74)"><rect width="218" height="86" rx="22" fill="#bad8e0"/><text x="26" y="38">Road wear</text><text x="26" y="64" font-size="14" font-weight="500">tyres and markings</text></g><g transform="translate(78 217)"><rect width="218" height="86" rx="22" fill="#ffd5b6"/><text x="26" y="38">Daily products</text><text x="26" y="64" font-size="14" font-weight="500">microbeads, packaging</text></g><g transform="translate(623 217)"><rect width="218" height="86" rx="22" fill="#ecd8e0"/><text x="26" y="38">Wastewater</text><text x="26" y="64" font-size="14" font-weight="500">effluent and sludge</text></g><g transform="translate(78 360)"><rect width="218" height="86" rx="22" fill="#bad8e0"/><text x="26" y="38">Agriculture</text><text x="26" y="64" font-size="14" font-weight="500">mulch, runoff</text></g><g transform="translate(623 360)"><rect width="218" height="86" rx="22" fill="#ffd5b6"/><text x="26" y="38">Marine activity</text><text x="26" y="64" font-size="14" font-weight="500">fishing gear, coatings</text></g></g><g stroke="#223040" stroke-width="4" stroke-linecap="round" opacity=".18"><path d="M296 117 C360 132 397 169 425 207"/><path d="M623 117 C560 132 523 169 495 207"/><path d="M296 260 H390"/><path d="M623 260 H530"/><path d="M296 403 C360 384 398 348 425 315"/><path d="M623 403 C560 384 523 348 495 315"/></g></svg>